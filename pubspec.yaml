name: app
description: "Catálogo de animes e mangás com personagens e dubladores, usando a Jikan API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.3.1
  http: ^1.4.0
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  cached_network_image: ^3.3.0
  country_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.png
  android: false
  ios: false
  web: false
